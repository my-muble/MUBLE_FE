name: API
description: 백엔드 API 연동 및 데이터 처리 작업을 등록합니다.
title: '[API] '

body:
  - type: textarea
    id: description
    attributes:
      label: 작업 설명
      description: 연동할 API와 구현할 기능을 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: API 정보
      description: 연동할 API의 메서드 및 엔드포인트를 작성해 주세요.
      placeholder: |
        GET /api/search
        POST /api/records
    validations:
      required: false

  - type: textarea
    id: tasks
    attributes:
      label: 작업 항목
      value: |
        - [ ] API 요청 및 응답 타입 정의
        - [ ] API 호출 로직 구현
        - [ ] 화면 데이터 연동
        - [ ] 로딩 및 에러 상태 처리
        - [ ] 정상 및 실패 시나리오 확인
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 작업이 완료되었다고 판단할 기준을 작성해 주세요.
    validations:
      required: true
